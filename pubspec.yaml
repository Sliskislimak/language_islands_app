name: language_islands_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons
  cupertino_icons: ^1.0.8

  # Audio engine & Background handling
  just_audio: ^0.9.44
  audio_session: ^0.1.25
  
  # Network & API
  http: ^1.3.0

  # System paths & File system
  path_provider: ^2.1.5
  path: ^1.9.0

  # State management
  flutter_riverpod: ^2.6.1

  # Local Key-Value store (settings/preferences)
  shared_preferences: ^2.3.5

  # Japanese typography support
  google_fonts: ^6.2.1
  just_audio_windows: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true