name: Build iOS IPA

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build iPhone IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y Runner.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: language-islands-ios
          path: Runner.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/friend-guide-website' || github.ref == 'refs/heads/feat/friend-shared-list-sync'
        with:
          tag_name: v1.1.0
          name: "Language Islands v1.1.0 (Release)"
          draft: false
          prerelease: false
          body: |
            ## 🌸 Language Islands v1.1.0 (iOS IPA)

            Dedicated language exchange app for **Koharu & Jakub**.

            ### ✨ Highlights (v1.1.0)
            - ➕ **Dodawanie pojedynczych fiszek**: Szybkie dodawanie nowych fiszek bez edycji surowego JSON
            - ✏️ **Nowy tryb edycji grup fiszek**: Ekran zarządzania fiszkami, wyszukiwanie, edycja i usuwanie
            - 🔍 **Edycja pojedynczej fiszki w trakcie nauki**: Przycisk edycji na karcie fiszki oraz w Focus Mode
            - 🇵🇱 **Polish Learning Mode**: High-quality neural voices (`Marek` & `Zofia`)
            - 🔤 **Katakana Phonetic Guides**: Pronunciation helper beneath Polish sentences
            - ☁️ **GitHub Gist Sync**: Two-way remote synchronization of study phrases
            - 💌 **Phrase Exchange**: Send daily Japanese phrases straight to Jakub
            - 🎧 **Shadowing & Active Recall**: Dual scientific memorization modes

            ### 📱 How to Install via SideStore
            1. Download `Runner.ipa` on your iPhone in Safari.
            2. Connect to **LocalDevVPN**.
            3. Open **SideStore** -> `My Apps` -> tap `+` -> select `Runner.ipa`.
          files: Runner.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
